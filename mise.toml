[tools]
hk = "latest"
node = "26.11.0"
ruby = "latest"
"gem:foreman" = "latest"

[hooks]
postinstall = ["bundle install", "npm install", "hk install --mise"]

[tasks.development]
description = "Start the dummy Rails application"
run = 'test/dummy/bin/dev "$@"'

[tasks.fix]
run = "bundle exec standardrb --fix && npm run format:views"

[tasks.lint]
run = "bundle exec standardrb && npm run lint:views && npm run check:views"

[tasks.pre-commit]
run = "hk run pre-commit"

[tasks.release]
description = "Build the gem and publish it to GitHub and RubyGems"
run = '''
#!/usr/bin/env bash
set -eu

notes="$*"
version=$(bundle exec ruby -Ilib -rsolid_dashboard -e 'print SolidDashboard::VERSION')
prerelease=$(ruby -rrubygems -e 'puts Gem::Version.new(ARGV.fetch(0)).prerelease?' "$version")

flags=()
if [ "$prerelease" = "true" ]; then
  flags+=(--prerelease)
fi
if [ -n "$notes" ]; then
  flags+=(--notes "$notes")
fi
SECRET_KEY_BASE_DUMMY=1 RAILS_ENV=production bundle exec rake solid_dashboard:assets:build
gem build solid_dashboard.gemspec
git tag -a "v$version" -m "Release $version"
git push origin "v$version"
gh release create "v$version" \
                  "solid_dashboard-$version.gem" \
                  --verify-tag \
                  --title "$version" \
                  --generate-notes "${flags[@]}"
gem push "solid_dashboard-$version.gem" --host https://rubygems.org
'''

