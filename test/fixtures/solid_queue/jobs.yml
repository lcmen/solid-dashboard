  class_name: FastJob
  queue_name: fast
  active_job_id: shared-attempt
  arguments: '{"job_class":"FastJob","arguments":[],"executions":1}'
  finished_at: <%= 1.minute.ago %>
  created_at: <%= 3.minutes.ago %>
  updated_at: <%= 1.minute.ago %>

running:
  class_name: FastJob
  queue_name: fast
  active_job_id: running-attempt
  arguments: '{"job_class":"FastJob","arguments":[],"executions":1}'
  scheduled_at: <%= 1.minute.ago %>
