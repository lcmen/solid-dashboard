name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        env:
          MISE_NO_HOOKS: "1"
      - run: bundle install
      - run: mise exec -- hk check --all
      - run: ASSET_PIPELINE=sprockets bundle exec rake test
      - run: bundle exec ruby -Ilib -rsolid_dashboard -e 'puts SolidDashboard::VERSION'
      - run: gem build solid_dashboard.gemspec
